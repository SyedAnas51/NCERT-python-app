apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-app
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calculator-app
  template:
    metadata:
      labels:
        app: calculator-app
    spec:
      containers:
      - name: calculator-app
        image: calculator-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: calculator-service
  namespace: prod
spec:
  selector:
    app: calculator-app
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP
