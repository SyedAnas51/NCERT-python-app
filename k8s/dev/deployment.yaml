apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-app
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calculator-app
  template:
    metadata:
      labels:
        app: calculator-app
    spec:
      containers:
      - name: calculator-app
        image: calculator-app:latest
        imagePullPolicy: IfNotPresent
